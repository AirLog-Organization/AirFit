AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AirFit backend (API Gateway HTTP API + Lambda)

# 외부 API 키. 배포 때 --parameter-overrides로 넘긴다. 비어 있으면 /api/health만 정상 동작한다
Parameters:
  KakaoRestApiKey:
    Type: String
    NoEcho: true
    Default: ""
  OpenWeatherApiKey:
    Type: String
    NoEcho: true
    Default: ""
  AirKoreaServiceKey:
    Type: String
    NoEcho: true
    Default: ""

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: [GET, OPTIONS]
        AllowOrigins: ["*"]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: airfit.handler.lambda_handler
      Environment:
        Variables:
          KAKAO_REST_API_KEY: !Ref KakaoRestApiKey
          OPENWEATHER_API_KEY: !Ref OpenWeatherApiKey
          AIRKOREA_SERVICE_KEY: !Ref AirKoreaServiceKey
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
        Regions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/regions
            Method: GET
        Conditions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/conditions
            Method: GET

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
