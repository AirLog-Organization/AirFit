name: 기능 제안
description: 새 기능이나 개선 아이디어를 제안해 주세요.
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - frontend (화면)
        - backend (API, 생활지수)
        - 옷차림 규칙
        - ai (LLM 분류, 챗봇)
        - CI/CD, 배포
        - 문서
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 지금 불편한 점이나 필요한 상황을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 어떻게 동작하면 좋을지 적어 주세요. 규칙(JSON) 변경이라면 기준과 근거 자료도 함께 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
