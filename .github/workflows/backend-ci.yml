name: Backend CI

# 브랜치 보호의 필수 체크가 문서만 바꾼 PR에서도 보고되도록 경로 조건 없이 항상 실행한다
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # template.yaml의 Lambda 런타임과 맞춘다
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/src/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        # 제안서 성공 기준: 백엔드 단위 테스트 커버리지 70% 이상
        run: pytest --cov=airfit --cov-report=term-missing --cov-fail-under=70

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint
        env:
          AWS_DEFAULT_REGION: ap-northeast-2
