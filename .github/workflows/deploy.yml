name: Deploy

# main에 들어온 백엔드 변경을 SAM으로 배포한다. 테스트는 PR 단계의 Backend CI가 맡는다.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  # OIDC 토큰으로 AWS role을 맡는다 (장기 키 없음)
  id-token: write
  contents: read

# 배포가 겹치면 CloudFormation 스택이 꼬이므로 하나씩, 진행 중인 배포는 끊지 않는다
concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # template.yaml의 Lambda 런타임과 맞춘다
          python-version: "3.14"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # role ARN은 infra/github-oidc.yaml 스택 출력값을 저장소 변수로 넣어 둔다
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Build
        run: sam build

      - name: Deploy
        run: >-
          sam deploy
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --role-arn "${{ vars.AWS_CFN_EXEC_ROLE_ARN }}"

      - name: Smoke test
        run: |
          api_url=$(aws cloudformation describe-stacks --stack-name airfit-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl -fsS "$api_url/api/health"
